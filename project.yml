name: GLBViewer
options:
  bundleIdPrefix: com.markglb
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GLTFSceneKit:
    url: https://github.com/magicien/GLTFSceneKit
    revision: a9587ec5c6515ee7d036533fdd909815a9a718ef

schemes:
  GLBViewer:
    build:
      targets:
        GLBViewer: all
    run:
      config: Debug

targets:
  GLBViewer:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/GLBViewer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GLB Viewer
        NSHumanReadableCopyright: ""
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.khronos.gltf-binary
            UTTypeDescription: glTF Binary
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - glb
              public.mime-type:
                - model/gltf-binary
        CFBundleDocumentTypes:
          - CFBundleTypeName: glTF Binary
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.khronos.gltf-binary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markglb.GLBViewer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: PreviewExtension
        embed: true
      - target: ThumbnailExtension
        embed: true
      - package: GLTFSceneKit

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - Shared
      - PreviewExtension
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: GLB Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.gltf-binary
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markglb.GLBViewer.PreviewExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: GLTFSceneKit

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - Shared
      - ThumbnailExtension
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: GLB Thumbnail
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - org.khronos.gltf-binary
            QLSupportsSearchableItems: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markglb.GLBViewer.ThumbnailExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: GLTFSceneKit
